description: pr-eval-agent — replay DB inputs through the LLM-approach evaluator and assert on the audit Markdown

prompts:
  # Unused — the python provider builds the real prompt itself — but promptfoo requires the field.
  - id: passthrough
    raw: "{{record.file}}"

providers:
  # Default — matches the model that produced the baseline reports in tmp/poc/.../reports_generated/
  - id: file://providers/review_provider.py
    label: claude-sonnet-4-5
    config:
      provider: claude
      model: claude-sonnet-4-5-20250929
      review_approach: llm

  # Uncomment to also evaluate Gemini in the same run (produces a side-by-side diff).
  # - id: file://providers/review_provider.py
  #   label: gemini-2.5-flash
  #   config:
  #     provider: gemini
  #     model: gemini-2.5-flash
  #     review_approach: llm

# Generated by: python scripts/generate_fixtures.py --repo <owner/repo> --pr <number>
# Add --baseline-dir ../tmp/poc/<run_id>/reports_generated/ for regression checks.
tests: file://fixtures/tests.json
